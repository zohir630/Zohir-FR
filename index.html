<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zohir Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer}
#top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;position:relative}
#top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
#ok{position:relative;overflow:hidden;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:14px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px}
#ok i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(0,0,0,.28);transition:width .2s linear}
#ok>*{position:relative}
#ok:disabled{opacity:.6}
#menu{position:absolute;top:56px;left:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:5;display:none;min-width:170px}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:14px}
#menu button:active{background:var(--bg)}
.pg{display:none;flex:1;min-height:0;flex-direction:column}
.pg.on{display:flex}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px;position:relative}
canvas{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.16);cursor:pointer}
#st{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11.5px;background:var(--card);border:1px solid var(--bd);color:var(--mu);padding:3px 12px;border-radius:20px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#sheet{margin:6px 12px 0;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 6px 10px}
#sub{display:flex;gap:6px;padding:0 6px 8px}
#sub button{flex:1;border:0;background:var(--bg);color:var(--mu);border-radius:12px;padding:7px 0;font-size:12.5px;font-weight:600}
#sub button.on{background:var(--tx);color:var(--bg)}
.pn{display:none;flex-direction:column;gap:8px}
.pn.on{display:flex}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center;padding:2px 6px}
.row::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:6px 12px;font-size:12.5px;line-height:1.25;text-align:center}
.ch small{display:block;font-size:10px;color:var(--mu)}
.ch.on{border-color:var(--ac);background:var(--ac);color:#fff}
.ch.on small{color:#ffe0ee}
.sw{flex:0 0 auto;width:36px;height:36px;border-radius:12px;border:2px solid var(--bd);padding:0}
.sw.c{border-radius:50%;width:30px;height:30px}
.sw.on{outline:3px solid var(--ac);outline-offset:2px}
.in{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;margin:0 6px;flex:1 1 0;min-width:0}
.fld{display:flex;flex-direction:column;gap:8px;padding:4px 6px}
.fld .in{margin:0;flex:none}
#nav{display:flex;margin:8px 12px 10px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:5px;gap:4px}
#nav button{flex:1;border:0;background:none;color:var(--mu);border-radius:17px;padding:7px 0;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button.on{background:var(--ac);color:#fff}
.sc{overflow:auto;padding:6px 14px 14px}
.sc h2{font-size:16px;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px}
.cd img,.cd video{width:100%;border-radius:10px;display:block;max-height:240px;object-fit:contain;background:var(--bg)}
.cd a{text-align:center;background:var(--ac);color:#fff;border-radius:10px;padding:7px;font-size:13px;font-weight:600;text-decoration:none}
.em{color:var(--mu);text-align:center;margin-top:50px;font-size:14px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:24px}
#md.on{display:flex}
#md div{background:var(--card);border-radius:20px;padding:18px;max-width:340px;width:100%}
#md h3{margin:0 0 8px}
#md p{margin:0 0 14px;color:var(--mu);font-size:14px;line-height:1.5;white-space:pre-line}
#md button{width:100%;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:9px;font-weight:700}
input[type=file]{display:none}
</style>
</head>

</div>

<div class="pg on" id="pg-home">
 <div id="stage"><canvas id="cv"></canvas><div id="st">ফোনের স্ক্রিনে ট্যাপ করে ছবি বা ভিডিও দাও</div></div>
 <div id="sheet">
  <div id="sub"><button class="on">টেমপ্লেট</button><button>লেখা</button><button>ফোন</button><button>রং</button></div>
  <div class="pn on"><div class="row" id="r-tp"></div></div>

  <div class="pn"><div class="row" id="r-dev"></div><div class="row" id="r-fr"></div></div>
  <div class="pn"><div class="row" id="r-bg"></div></div>
 </div>
</div>

<div class="pg" id="pg-done"><div class="sc"><h2>✅ কমপ্লিট করা ডিজাইন</h2><div class="grid" id="dn"></div><div class="em" id="dem">এখনো কিছু সেভ করা হয়নি।<br>হোম থেকে ✓ চাপলে এখানে জমা হবে।</div></div></div>

 <p style="color:var(--mu);font-size:12px;margin:0">এগুলো ফোনেই সেভ থাকে এবং সব টেমপ্লেটে বসে যায়।</p></div></div></div>

<div id="nav">
 <button class="on" data-p="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>হোম</button>
 <button data-p="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>কমপ্লিট</button>

</div>
<div id="md"><div><h3 id="mt"></h3><p id="mb"></p><button id="mc">ঠিক আছে</button></div></div>

 else if(m=='contact')modal('যোগাযোগ',P.b+'\n'+P.w+'\n'+P.f);
 else modal('কীভাবে ব্যবহার করবে','১. টেমপ্লেট বেছে নাও।\n২. ফোনের স্ক্রিনে ট্যাপ করে ছবি বা ভিডিও দাও।\n৩. লেখা, ফোন আর রং বদলাও।\n৪. উপরের ✓ চাপলে সেভ হবে।')}});

$('f').onchange=function(e){
 var f=e.target.files[0];if(!f)return;
 var u=URL.createObjectURL(f),v=f.type.indexOf('video')==0,el=document.createElement(v?'video':'img');
 if(v){el.muted=true;el.loop=true;el.playsInline=true;el.src=u;el.onloadeddata=function(){el.play().catch(function(){});dirty=true}}
 else{el.onload=function(){dirty=true};el.src=u}
 slots[cur]={el:el,v:v};e.target.value='';$('st').textContent=v?'ভিডিও যোগ হয়েছে, ✓ চাপলে সেভ হবে':'ছবি যোগ হয়েছে, ✓ চাপলে সেভ হবে';
};
cv.onclick=function(e){
 var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*cv.width/r.width,py=(e.clientY-r.top)*cv.height/r.height;
 for(var i=hits.length-1;i>=0;i--){var h=hits[i];if(!h)continue;var p=h.m.inverse().transformPoint(new DOMPoint(px,py));
  if(p.x>=h.b&&p.x<=h.b+h.d[2]&&p.y>=h.b&&p.y<=h.b+h.d[3]){cur=i;$('f').click();return}}
};

function addDone(blob,ext){
 var u=URL.createObjectURL(blob),n='zohir-mockup-'+(done.length+1)+'.'+ext;
 done.unshift({u:u,e:ext,n:n});
 $('dem').style.display='none';
 $('dn').innerHTML=done.map(function(d){return '<div class="cd">'+(d.e=='png'?'<img src="'+d.u+'">':'<video src="'+d.u+'" controls playsinline muted></video>')+'<a href="'+d.u+'" download="'+d.n+'">ডাউনলোড</a></div>'}).join('');
 var a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();
}
function initA(){if(ax)return;ax=new (window.AudioContext||window.webkitAudioContext)();gn=ax.createGain();dest=ax.createMediaStreamDestination();gn.connect(ax.destination)}
function wire(v){if(v._w)return;var s=ax.createMediaElementSource(v);s.connect(gn);s.connect(dest);v._w=1}

$('ok').onclick=async function(){
 if(rec)return;
 var vs=vids(),btn=$('ok');
 if(!vs.length){
  sc=2;setC();render();
  var bl=await new Promise(function(r){cv.toBlob(r,'image/png')});
  sc=1;setC();addDone(bl,'png');$('st').textContent='ছবি সেভ হয়েছে ✓ কমপ্লিট ট্যাবে দেখো';return;
 }
 if(!window.MediaRecorder){$('st').textContent='এই ব্রাউজারে ভিডিও সেভ হবে না, Chrome ব্যবহার করো';return}
 initA();await ax.resume();rec=true;btn.disabled=true;
 vs.forEach(function(v){wire(v);v.muted=false;v.pause()});gn.gain.value=0;
 var lead=vs.reduce(function(a,b){return b.duration>a.duration?b:a});
 await Promise.all(vs.map(function(v){return v.currentTime>.01?new Promise(function(r){v.onseeked=r;v.currentTime=0}):0}));
 vs.forEach(function(v){v.onseeked=null;v.loop=v!==lead});
 render();await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});
 var stream=cv.captureStream(30),t=dest.stream.getAudioTracks()[0];if(t)stream.addTrack(t);
 var mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].filter(function(m){return MediaRecorder.isTypeSupported(m)})[0]||'';
 var bps=Math.min(40e6,Math.max(8e6,W*H*30*.2)),ch=[];
 var mr=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:bps}:{videoBitsPerSecond:bps});
 mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
 mr.onstop=function(){
  vs.forEach(function(v){v.loop=true;v.muted=true;v.ontimeupdate=null;v.onended=null;v.currentTime=0;v.play().catch(function(){})});
  gn.gain.value=1;rec=false;btn.disabled=false;
  $('fill').style.width='0';$('dt').textContent='';$('tk').style.display='';
  addDone(new Blob(ch,{type:mt||'video/webm'}),mt.indexOf('mp4')>-1?'mp4':'webm');
  $('st').textContent='ভিডিও সেভ হয়েছে ✓ কমপ্লিট ট্যাবে দেখো';
 };
 $('tk').style.display='none';$('st').textContent='রেকর্ড হচ্ছে, ট্যাব খোলা রাখো...';
 lead.ontimeupdate=function(){var p=lead.currentTime/lead.duration;$('fill').style.width=(p*100)+'%';$('dt').textContent=bn(Math.min(99,Math.floor(p*100)))+'%'};
 lead.onended=function(){setTimeout(function(){mr.stop()},200)};
 mr.start();vs.forEach(function(v){v.play()});
};
setC();
</script>
